# RH20T unseen-view prediction with point-cloud AND action conditioning.
# As rh20t_unseen_pc.yaml, plus the robot end-effector trajectory of every clip frame
# rendered into each view (fastvideo/dataset/rh20t_actions.py): 16 zero-init input channels.
# Warm-started from the point-cloud run at step 78,500 (outputs/rh20t_pc_week_20261024),
# exported and widened by scripts/rh20t/prepare_actions_checkpoint.sbatch. The week run
# continuing from the same step is the matched no-action control (same data and global
# batch 32 = 4 GPUs x 4 x accumulation 2; this run starts a fresh optimizer).
# Launch (1 node x 4 H100):
#   sbatch --nodes 1 -J rh20t_pc_actions scripts/rh20t/train_multiview_h100.sbatch \
#       examples/train/configs/fine_tuning/wan/rh20t_unseen_pc_actions.yaml

models:
  student:
    _target_: fastvideo.train.models.wan.multiview.WanMultiViewModel
    init_from: /n/lab_storage/ydu_lab/Lab/haonan/datasets/models/rh20t_pc_78500_act16/Wan2.1-T2V-1.3B-Diffusers
    trainable: true
    design: tokens
    point_cloud: true
    actions: true
    n_hist_latent: 1      # latent frame 0 (= pixel frame 0 of every view) is clean history
    p_no_hist: 0.1        # fraction of samples trained with no history (unconditional)
    vae_encode_chunk: 8
    dataset:
      data_root: /n/netscratch/ydu_lab/Lab/akiruga/rh20t_lowres/data   # official 320x180 color
      calib_root: /n/lab_storage/ydu_lab/Lab/haonan/datasets/rh20t/calib
      records_cache_dir: /n/lab_storage/ydu_lab/Lab/haonan/datasets/rh20t/cache
      cfgs: null            # null = all of 1..7
      min_rating: null      # rating 1 = failed task; failures are still valid dynamics
      test_percentage: 0.02
      n_views: 4
      n_frames: 13          # 1 + 4*3 -> 4 latent frames
      fps: 3                # 13 frames span 4 s; at 10 Hz RH20T barely moves
      max_sync_err_ms: 60
      height: 160
      width: 320
      raymap_height: 20
      raymap_width: 40
      n_context_views: 2
      depth_root: /n/lab_storage/ydu_lab/Lab/haonan/datasets/rh20t/depth
      point_cloud: true
      actions: true
      lowdim_root: /n/lab_storage/ydu_lab/Lab/haonan/datasets/rh20t/lowdim

method:
  _target_: fastvideo.train.methods.fine_tuning.multiview_flow.MultiViewFlowMethod
  validation_every_steps: 1000
  validation_batches: 2
  validation_batch_size: 2
  validation_sampling_steps: 30

training:
  distributed:
    num_gpus: 4           # the H100 launcher overrides num_gpus / hsdp_replicate_dim
    sp_size: 1            # required: every rank draws its own RH20T batch
    tp_size: 1
    hsdp_replicate_dim: 4
    hsdp_shard_dim: 1

  data:
    dataloader_num_workers: 12
    train_batch_size: 4   # per GPU (H100 80GB); 3200 tokens/sample
    seed: 1000

  optimizer:
    learning_rate: 2.0e-5
    betas: [0.9, 0.95]
    weight_decay: 0.05
    lr_scheduler: constant_with_warmup
    lr_warmup_steps: 200

  loop:
    max_train_steps: 1000000000   # bounded by the allocation time
    gradient_accumulation_steps: 2

  checkpoint:
    output_dir: /n/lab_storage/ydu_lab/Lab/haonan/projects/multi-view-world-model/outputs/rh20t_pc_actions_20261030
    training_state_checkpointing_steps: 1000
    checkpoints_total_limit: 3
    resume_from_checkpoint: latest

  tracker:
    project_name: rh20t_multiview
    run_name: rh20t_pc_actions_20261030

  model:
    enable_gradient_checkpointing_type: full

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

pipeline:
  flow_shift: 3
