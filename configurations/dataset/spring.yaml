defaults:
  - video_base
  - _self_

# Spring (Mehl et al., CVPR'23), LEFT view only, 37 train sequences. The subset Geo4D
# re-hosts for training: frame_left/*.png + disp1_left/*.dsp5 + cam_data/*.txt.
# Loose directory tree on FASRC netscratch. Geometry is identical to TartanAir
# (OpenCV optical c2w, first-frame-identity, modified-disparity depth, Plucker raymaps);
# see datasets/spring.py and datasets/geometry_verification/spring/.
data_root: /n/netscratch/ydu_lab/Everyone/Lab/datasets/geo4d/spring/train
metadata_path: ""
load_prompt_embed: true
caption_cache_dir: /n/netscratch/ydu_lab/Everyone/datasets/video_3d_data/annotations/spring
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
# Spring is rendered at native 24 fps; sample consecutively (fps == fps_source -> stride 1).
# Sequences are long (up to ~250 frames) so 50-frame clips fit. Tune stride later if the
# per-frame camera baseline is too small for NVS.
fps: 24
fps_source: 24
n_frames: 50
test_percentage: 0.05   # ~2 sequences held out for validation/test
# Same target resolution + raymap grid as TartanAir so the two mix cleanly. Source is
# 1920x1080 (16:9); the loader center-crops to the 4:3 target aspect then resizes.
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# Per-dataset scale_preserving constant = this datasets measured depth-P90 (scripts/compute_global_scale.py).
# scale_preserving=True divides BOTH depth and camera-moments by this so each datasets depth-disparity
# distribution lands in the same ~[0.4,0.9] range -> datasets "look the same" (vs one global 30 that made
# ASE 2-5m scenes saturate near +1 while vkitti2 130m spread to -1). metric scale preserved WITHIN each dataset.
mutual_scale: 42.0

# record-walk cache (scripts/build_records_manifest.py) — instant startup; delete if data changes
records_manifest: _records_manifest.json
