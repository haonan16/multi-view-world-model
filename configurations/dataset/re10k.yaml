defaults:
  - video_base
  - _self_

# old (relative symlink into zhiyi24 holy-isilon, kept for reference when discussing with zhiyi):
# data_root: ./data/re10k
data_root: /n/netscratch/ydu_lab/Everyone/datasets/re10k
metadata_path: ""  # RE10K loads from directory structure, not a metadata csv
load_prompt_embed: true
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
# max_mean_adj_rotation_deg: 3.5
fps: 8      # calibrated (tune_fps @ 50 samples; pivot)
n_frames: 50
test_percentage: 0.01
height: 240
width: 320
raymap_height: 30   # height // vae_stride (240 // 8)
raymap_width: 40    # width  // vae_stride (320 // 8)

min_camera_travel: 0.0  # skip clips with total camera path length below this (0 = disabled)
# min_camera_travel: 0.0  # skip clips with total camera path length below this (0 = disabled)

filtering:
  disable: true  # RE10K dataset handles its own filtering

augmentation:
  random_flip: null
  ratio: null
  scale: null

# records-manifest cache (video_base._load_records_cached): first run walks + writes
# the JSON to the central manifest dir; every later startup loads it instantly.
records_manifest: _records_manifest.json
