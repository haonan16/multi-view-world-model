defaults:
  - video_base
  - _self_

# DL3DV with the ORIGINAL COLMAP-derived poses (nerfstudio transforms.json for
# 8K~10K, per-frame dense/cam npz for 1K~7K) instead of ViPE. NVS-ONLY subset:
# COLMAP scale is arbitrary per scene and there is no depth, so it trains like
# re10k — rays as history, predict RGB (diffusion_forcing settings [2, 3]).
# 7889 usable scenes (dense 6378 + flat 1511, counted 2026-07-07).
data_root: /n/netscratch/ydu_lab/Everyone/datasets/dl3dv/processed_dl3dv_ours
prompt_embeds_root: /n/netscratch/ydu_lab/Everyone/datasets/dl3dv_prompt_embeds
metadata_path: ""
splits: [1K, 2K, 3K, 4K, 5K, 6K, 7K]        # dense layout: dense/{rgb,cam}
splits_flat: [8K, 9K, 10K]                  # flat layout: images_4 + transforms.json

load_prompt_embed: true
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
fps: 30      # 30-fps walkthroughs, sample consecutively (same as dl3dv.yaml)
n_frames: 49
test_percentage: 0.01
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# records-manifest cache (video_base._load_records_cached): first run walks + writes
# the JSON to the central manifest dir; every later startup loads it instantly.
records_manifest: _records_manifest.json
