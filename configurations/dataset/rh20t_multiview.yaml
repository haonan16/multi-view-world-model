defaults:
  - video_base
  - _self_

# RH20T multiview (datasets/rh20t.py): V synchronised calibrated RGB views per sample,
# robot episodes only. Official 320x180 release, downloaded by
# scripts/rh20t/lowres_download.sbatch.
data_root: /n/netscratch/ydu_lab/Lab/akiruga/rh20t_lowres/data
calib_root: /n/netscratch/ydu_lab/Lab/akiruga/rh20t_lowres/calib
metadata_path: ""
cfgs: null              # null = all of 1..7
min_rating: null        # rating 1 = failed task; failures are still valid dynamics
test_percentage: 0.02   # held out by a stable hash of the episode name

n_views: 4
n_frames: 13            # 1 + 4*3 -> 4 latent frames with the 4x temporal VAE
# Frames are irregular in time (~7-11 Hz); views are resampled onto a uniform grid at
# `fps` by nearest timestamp and rejected if any frame is further than max_sync_err_ms.
# 3 Hz -> 13 frames span 4 s. At 10 Hz (1.2 s) RH20T barely moves: copying frame 0
# scores 28.4 dB median PSNR vs 22.6 dB at 3 Hz (held-out clips, 2026-10-09).
fps: 3
max_sync_err_ms: 60

# Per-view resolution for the "tokens" design; the "tiled" design packs n_views into
# ONE canvas of this size (fixed canvas). 160x320 = centre crop of 180x320 (no stretch),
# divisible by 32 so the 16x VAE + 2x2 patch works for each view and for 2x2 tiles.
height: 160
width: 320
raymap_height: 20       # height // 8
raymap_width: 40        # width  // 8

load_prompt_embed: false
load_video_latent: false
image_to_video: false

# record-walk cache (VideoDataset._load_records_cached); delete if the data changes
records_manifest: _rh20t_mv_records.json   # rename if the record logic changes

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null
