defaults:
  - video_base
  - tartanair@subset/tartanair
  - re10k@subset/re10k
  - _self_

# TartanAir V1 + RE10K 50/50 (rebuttal 1.3B variant), heterogeneous diffusion settings via
# launch-script overrides: tartanair [0,1,2,3,4] (full menu), re10k [0,1,2,3] (all except
# 4, the only setting that needs depth as INPUT — re10k has_depth=False). re10k's depth
# targets in 0-3 are auto-masked (t-clamp=1 + loss mask) -> RGB-gen + pose + NVS only.
data_root: null
metadata_path: null
load_prompt_embed: true
load_video_latent: false
scale_preserving: true
height: 288
width: 384
n_frames: 50
fps: 10
raymap_height: 36
raymap_width: 48
training: {weight_type: absolute, weight: {tartanair: 1.0, re10k: 1.0}}  # absolute = true 50/50; relative would give ~0.5%/99.5% by dataset size and starve depth
validation: {weight_type: absolute, weight: {tartanair: 1.0, re10k: 1.0}}
test: {weight_type: absolute, weight: {tartanair: 1.0, re10k: 1.0}}
