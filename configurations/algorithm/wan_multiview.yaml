defaults:
  - base_pytorch_algo
  - _self_

# Multiview ablation (algorithms/wan/wan_multiview.py). design: tokens | tiled.
design: tokens
n_views: ${dataset.n_views}
n_frames: ${dataset.n_frames}
height: ${dataset.height}
width: ${dataset.width}

lr: ${experiment.training.lr}
betas: [0.9, 0.95]
weight_decay: 5e-2
lr_scheduler:
  name: constant_with_warmup
  num_warmup_steps: 500

num_train_timesteps: 1000
sample_shift: 3.0
sample_steps: 30
n_hist_latent: 1        # test time: latent frame 0 (= pixel frame 0 of every view) is clean history
p_no_hist: 0.1          # (v1 name, kept for old runs; the mixture below is what training uses)

# camera conditioning (algorithms/wan/modules/model_multiview.py): concat | cat4d | prope | gta | camtoken
cam_mode: concat

# diffusion-forcing noise mixture (WanMultiView.sample_noise_levels); default = v1 behaviour
noise:
  mix: {single_view: 0.0, first_frame: 0.9, rand_history: 0.0, independent: 0.0, view_history: 0.0, none: 0.1}
  hist_noise_prob: 0.0   # prob that history is slightly noised instead of clean
  hist_noise_max: 0.15   # max (shifted) t of noised history

# text: cached UMT5 embeddings of RH20T task descriptions (scripts/rh20t/make_task_text_embeds.py)
text:
  enabled: false
  embeds_path: /n/lab_storage/ydu_lab/Lab/akiruga/rh20t_meta/task_text_embeds_wan21.pt
  dropout: 0.1           # -> "" (enables classifier-free text guidance)
val_text_guidance: 0.0
val_hist_guidance: 0.0
val_hist_views: null    # validation history = frame 0 of the first K views (null: all; 1: view 0 only)
gradient_checkpointing_rate: 0.0
max_text_tokens: 512     # read by datasets/video_base.py (no text encoder is run here)

# UMT5 embedding of "" (scripts/rh20t/make_null_prompt_embed.py); RH20T has no captions here
null_prompt_embed_path: /n/netscratch/ydu_lab/Lab/akiruga/rh20t_lowres/null_prompt_embed_wan21.pt

vae:
  ckpt_path: Wan-AI/Wan2.1-T2V-1.3B/Wan2.1_VAE.pth
  z_dim: 16
  stride: [4, 8, 8]
  mean: [-0.7571, -0.7089, -0.9113, 0.1075, -0.1745, 0.9653, -0.1517, 1.5508, 0.4134, -0.0715, 0.5517, -0.3632, -0.1922, -0.9497, 0.2503, -0.2921]
  std: [2.8184, 1.4541, 2.3275, 2.6558, 1.2196, 1.7708, 2.6052, 2.0743, 3.2687, 2.1526, 2.8652, 1.5579, 1.6382, 1.1253, 2.8251, 1.9160]

model:
  ckpt_path: Wan-AI/Wan2.1-T2V-1.3B
  tuned_ckpt_path: null
