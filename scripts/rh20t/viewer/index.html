<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic point clouds · 30k models</title>
<style>
:root{--bg:#111315;--panel:#1a1d20;--fg:#e8ebee;--muted:#959ca5;--line:#2b3035;--accent:#ffc450;--gt:#c9cfcb;--tok:#6c9cf0;--til:#f0805c;--canvas:#ffffff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13.5px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:290px 1fr 300px;overflow:hidden}
aside{overflow:auto;padding:12px;border-right:1px solid var(--line)}
#right{border-right:0;border-left:1px solid var(--line);display:grid;gap:12px;align-content:start}
h1{font-size:14.5px;margin:0 0 2px} .sub{color:var(--muted);font-size:12px;margin:0 0 10px}
.scene{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--fg);padding:7px 9px;border-radius:6px;cursor:pointer;font:inherit;margin-bottom:2px}
.scene:hover{background:var(--panel)} .scene[aria-current="true"]{background:var(--panel);border-color:var(--line)}
.scene small{display:block;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
#stage{position:relative;min-width:0;background:var(--canvas)}
#stage canvas{display:block;width:100%;height:100%}
.lbl{position:absolute;top:10px;padding:4px 10px;border-radius:14px;background:#fffd;color:#111;border:1px solid #222;font:600 12px ui-monospace,Menlo,monospace;pointer-events:none}
#hud{position:absolute;left:12px;bottom:10px;color:#444;font:12px ui-monospace,Menlo,monospace;pointer-events:none;background:#fffc;padding:2px 6px;border-radius:4px}
#load{position:absolute;inset:0;display:grid;place-items:center;color:#555;font:13px ui-monospace,monospace;background:#fff8}
.grp{display:grid;gap:7px} .grp>.t{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
button,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:6px;align-items:center} .row input[type=range]{flex:1}
label.ck{display:flex;gap:7px;align-items:flex-start;cursor:pointer} label.ck small{display:block;color:var(--muted);font-size:11.5px}
.val{font:12px ui-monospace,Menlo,monospace}
#thumbs{display:grid;grid-template-columns:1fr 1fr;gap:4px} #thumbs canvas{width:100%;border-radius:3px;border:2px solid var(--line)}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px;width:100%}
td,th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right} td:first-child,th:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.tok{color:var(--tok)} .til{color:var(--til)}
kbd{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px}
</style></head>
<body>
<aside>
  <h1>Held-out RH20T · dynamic clouds</h1>
  <p class="sub" id="ck"></p>
  <div id="list"></div>
</aside>
<div id="stage"><div class="lbl" id="lblL" style="left:12px"></div><div class="lbl" id="lblR" style="left:calc(50% + 12px)"></div><div id="hud"></div><div id="load">loading…</div></div>
<aside id="right">
  <div class="grp"><div class="t">Compare</div>
    <div class="seg" id="mode"><button data-m="single">Single</button><button data-m="split" aria-pressed="true">GT | Pred</button><button data-m="sync" title="same as split">&nbsp;</button></div>
    <div class="seg" id="src"><button data-s="gt">GT</button><button data-s="pred_tokens" aria-pressed="true">Tokens</button><button data-s="pred_tiled">Tiled</button></div>
  </div>
  <div class="grp"><div class="t">Time</div>
    <div class="row"><button id="play">❚❚</button><input id="seek" type="range" min="0" max="12" value="0"><span class="val" id="tv">t 0</span></div>
    <div class="row"><span class="val">speed</span><input id="fps" type="range" min="0.5" max="6" step="0.5" value="3"><span class="val" id="fpsv">3 fps</span></div>
  </div>
  <div class="grp"><div class="t">Cleaning (all on = the videos)</div>
    <label class="ck"><input type="checkbox" data-bit="0" checked><span>Flying pixels<small>depth between the two sides of an edge</small></span></label>
    <label class="ck"><input type="checkbox" data-bit="1" checked><span>Depth smears<small>steep depth ramps from upsampled edges</small></span></label>
    <label class="ck"><input type="checkbox" data-bit="2" checked><span>Free-space floaters<small>other cameras see straight through it</small></span></label>
    <label class="ck"><input type="checkbox" data-bit="3" checked><span>Grazing surfaces<small>seen at &gt;78° to the ray</small></span></label>
    <label class="ck"><input type="checkbox" data-bit="4" checked><span>Far / coarse points<small>pixel footprint &gt; 10 mm</small></span></label>
    <label class="ck"><input type="checkbox" data-bit="5" checked><span>Isolated points<small>sparse voxel neighbourhood</small></span></label>
    <label class="ck"><input type="checkbox" data-bit="6" checked><span>Workspace crop<small>sphere around where the cameras point</small></span></label>
    <div class="row"><span class="val">confidence ≥</span><input id="conf" type="range" min="0" max="15" value="0"><span class="val" id="confv">off</span></div>
  </div>
  <div class="grp"><div class="t">Display</div>
    <div class="row"><span class="val">point size</span><input id="psz" type="range" min="0.3" max="3" step="0.1" value="1"></div>
    <label class="ck"><input type="checkbox" id="frus" checked><span>Camera frustums</span></label>
    <button id="reset">Reset view</button>
  </div>
  <div class="grp"><div class="t">Input views (current frame, right side)</div><div id="thumbs"></div></div>
  <div class="grp"><div class="t">Metrics</div><table id="met"></table></div>
  <p class="sub"><kbd>space</kbd> play · <kbd>←</kbd><kbd>→</kbd> step · <kbd>↑</kbd><kbd>↓</kbd> scene · drag to orbit, right-drag pan, scroll zoom</p>
</aside>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
const $=id=>document.getElementById(id), f=(x,d)=>x==null?'–':x.toFixed(d);
// surface any failure on the page instead of leaving "loading…" up
const fail=e=>{const el=$('load');el.hidden=false;el.style.color='#b00';el.textContent='error: '+(e&&(e.message||e.reason&&e.reason.message||e.reason)||e);};
addEventListener('error',fail); addEventListener('unhandledrejection',fail);
const VIEW_COL=[0xe65532,0x288cdc,0x28aa5a,0xc89614];
const NAMES={gt:'GROUND TRUTH',pred_tokens:'PRED · VIEWS AS TOKENS',pred_tiled:'PRED · VIEWS TILED'};
let S=null, sceneI=0, srcR='pred_tokens', mode='split', t=0, playing=true, last=0;
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setScissorTest(true); stage.prepend(renderer.domElement);
const cam=new THREE.PerspectiveCamera(40,1,0.01,50), ctl=new THREE.OrbitControls(cam,renderer.domElement); ctl.enableDamping=true;
const scenes={L:new THREE.Scene(),R:new THREE.Scene()}; scenes.L.background=scenes.R.background=new THREE.Color(0xffffff);
function pxScale(){return renderer.domElement.height/(2*Math.tan(THREE.MathUtils.degToRad(cam.fov/2)));}
const VERT=`uniform sampler2D tD,tC; uniform mat3 Kinv; uniform mat4 M; uniform float dmin,dmax,vIdx,nV,H,psz,pxS,confMin;
uniform float en[7]; uniform vec2 res; varying vec2 vUV;
float bit(float b,float k){return mod(floor(b/pow(2.0,k)),2.0);}
void main(){ vec2 uv=vec2((position.x+.5)/res.x,(vIdx*H+position.y+.5)/(H*nV)); vUV=uv;
 vec3 c=floor(texture2D(tD,uv).rgb*255.0+0.5);
 float q=c.r*16.0+floor(c.g/16.0), conf=mod(c.g,16.0), b=c.b;
 float d=q/4095.0*(dmax-dmin)+dmin; bool drop=d<1e-4||conf<confMin;
 for(int k=0;k<7;k++){ if(en[k]>0.5&&bit(b,float(k))<0.5) drop=true; }
 vec4 mv=modelViewMatrix*(M*vec4(Kinv*vec3(position.x+.5,position.y+.5,1.0)*d,1.0));
 gl_Position=drop?vec4(2.,2.,2.,1.):projectionMatrix*mv;
 gl_PointSize=drop?0.0:clamp(psz*1.4*d*Kinv[0][0]*pxS/max(0.05,-mv.z),1.0,12.0);}`;
const FRAG=`uniform sampler2D tC; varying vec2 vUV; void main(){gl_FragColor=vec4(texture2D(tC,vUV).rgb,1.0);}`;
const enabled=()=>[...document.querySelectorAll('[data-bit]')].map(c=>c.checked?1:0);
let geo=null; const sides={L:{pts:[],fr:null,data:null,src:'gt'},R:{pts:[],fr:null,data:null,src:'pred_tokens'}};
const cache=new Map();
function tex(bm){const x=new THREE.Texture(bm);x.flipY=false;x.minFilter=x.magFilter=THREE.NearestFilter;x.generateMipmaps=false;x.needsUpdate=true;return x;}
async function bm(url){return createImageBitmap(await (await fetch(url)).blob(),{premultiplyAlpha:'none',colorSpaceConversion:'none'});}
async function loadSrc(i,src){
  const k=i+'/'+src; if(cache.has(k))return cache.get(k);
  const base=`data/${i}/${src}/`, meta=await (await fetch(base+'meta.json')).json();
  let got=0; const tick=()=>{got++;$('load').textContent=`loading ${NAMES[src].toLowerCase()} · ${got}/${2*meta.T} images`;};
  const fr=await Promise.all([...Array(meta.T).keys()].map(async tt=>{const [d,c]=await Promise.all([bm(base+`dc_${tt}.png`).then(x=>(tick(),x)),bm(base+`col_${tt}.jpg`).then(x=>(tick(),x))]);return {d:tex(d),c:tex(c),cbm:c};}));
  const o={meta,fr}; cache.set(k,o);
  while(cache.size>6){const [kk,v]=cache.entries().next().value;v.fr.forEach(x=>{x.d.dispose();x.c.dispose();});cache.delete(kk);}
  return o;
}
function m3(K){return new THREE.Matrix3().set(...K[0],...K[1],...K[2]).invert();}
function m4(M){return new THREE.Matrix4().set(...M[0],...M[1],...M[2],0,0,0,1);}
function build(side,data){
  const sc=scenes[side], s=sides[side]; s.pts.forEach(p=>sc.remove(p)); s.pts=[]; if(s.fr){sc.remove(s.fr);s.fr=null;}
  const {V,H,W}=data.meta;
  if(!geo||geo.userData.n!==W*H){geo=new THREE.BufferGeometry();geo.userData.n=W*H;const a=new Float32Array(W*H*3);let k=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){a[k++]=x;a[k++]=y;a[k++]=0;}geo.setAttribute('position',new THREE.BufferAttribute(a,3));}
  for(let v=0;v<V;v++){const mat=new THREE.ShaderMaterial({vertexShader:VERT,fragmentShader:FRAG,uniforms:{tD:{value:null},tC:{value:null},Kinv:{value:new THREE.Matrix3()},M:{value:new THREE.Matrix4()},dmin:{value:0},dmax:{value:1},vIdx:{value:v},nV:{value:V},H:{value:H},psz:{value:+$('psz').value},pxS:{value:pxScale()},confMin:{value:+$('conf').value},en:{value:enabled()},res:{value:new THREE.Vector2(W,H)}}});
    const p=new THREE.Points(geo,mat);p.frustumCulled=false;p.userData.v=v;sc.add(p);s.pts.push(p);}
  s.data=data; s.fr=new THREE.Group(); sc.add(s.fr);
}
function frustums(side){const s=sides[side]; if(!s.fr)return; s.fr.clear(); if(!$('frus').checked)return;
  const fr=s.data.meta.frames[t], sc=0.06*s.data.meta.radius/0.5;
  fr.forEach((v,i)=>{const Ki=m3(v.K), M=m4(v.M), w=2*v.K[0][2], h=2*v.K[1][2];
    const cs=[[0,0],[w,0],[w,h],[0,h]].map(([x,y])=>new THREE.Vector3(x,y,1).applyMatrix3(Ki).multiplyScalar(sc).applyMatrix4(M));
    const o=new THREE.Vector3(0,0,0).applyMatrix4(M), P=[];cs.forEach(c=>P.push(o,c));for(let k=0;k<4;k++)P.push(cs[k],cs[(k+1)%4]);
    s.fr.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(P),new THREE.LineBasicMaterial({color:VIEW_COL[i]})));});}
function setT(x){t=x;['L','R'].forEach(side=>{const s=sides[side];if(!s.data)return;const fr=s.data.fr[t],meta=s.data.meta;
  s.pts.forEach(p=>{const u=p.material.uniforms,v=meta.frames[t][p.userData.v];u.tD.value=fr.d;u.tC.value=fr.c;u.Kinv.value=m3(v.K);u.M.value=m4(v.M);u.dmin.value=v.dmin;u.dmax.value=v.dmax;});frustums(side);});
  $('seek').value=t;$('tv').textContent='t '+t+(t===0?' · input':''); thumbs();
  const sc=S.scenes[sceneI]; $('hud').textContent=`${sc.name.replace(/_/g,' ')} · t=${t}/${sides.R.data.meta.T-1}${t===0?' (input)':' (generated)'}`;}
function thumbs(){const s=sides[mode==='single'?'R':'R'];if(!s.data)return;const {V,H,W}=s.data.meta,bmp=s.data.fr[t].cbm,box=$('thumbs');
  if(box.children.length!==V){box.innerHTML='';for(let v=0;v<V;v++){const c=document.createElement('canvas');c.width=W/2;c.height=H/2;c.style.borderColor='#'+VIEW_COL[v].toString(16).padStart(6,'0');box.appendChild(c);}}
  [...box.children].forEach((c,v)=>c.getContext('2d').drawImage(bmp,0,v*H,W,H,0,0,c.width,c.height));}
function resetView(){const m=sides.R.data.meta,up=new THREE.Vector3(...m.up),fwd=new THREE.Vector3(...m.fwd),c=new THREE.Vector3(...m.centre);
  const side=new THREE.Vector3().crossVectors(up,fwd),yaw=-0.6,el=0.5;
  const dir=fwd.clone().multiplyScalar(-Math.cos(yaw)).add(side.multiplyScalar(Math.sin(yaw))).multiplyScalar(Math.cos(el)).add(up.clone().multiplyScalar(Math.sin(el)));
  cam.up.copy(up);ctl.target.copy(c);cam.position.copy(c).add(dir.multiplyScalar(m.radius*2.6));ctl.update();}
async function show(i,keepCam){sceneI=i;$('load').hidden=false;
  document.querySelectorAll('.scene').forEach((b,k)=>b.setAttribute('aria-current',k===i));
  const di=S.scenes[i].i;                                   // data folder = original scene index
  const [L,R]=await Promise.all([loadSrc(di,'gt'),loadSrc(di,srcR)]); if(i!==sceneI)return;
  build('L',L);build('R',R); if(!keepCam)resetView(); setT(Math.min(t,R.meta.T-1)); labels(); metrics(); $('load').hidden=true;
  try{localStorage.setItem('cv_scene',i)}catch(e){}}
function labels(){$('lblL').hidden=mode==='single';$('lblL').textContent=NAMES.gt;$('lblR').textContent=NAMES[srcR];$('lblR').style.left=mode==='single'?'12px':'calc(50% + 12px)';}
function metrics(){const s=S.scenes[sceneI],m=s.metrics,c=s.clouds||{};
  $('met').innerHTML='<tr><th></th><th>PSNR</th><th>LPIPS</th><th>cloud mm</th></tr>'+[['tokens','pred_tokens','Tokens','tok'],['tiled','pred_tiled','Tiled','til']].map(([k,ck,n,cl])=>
  `<tr><td class="${cl}">${n}</td><td>${f(m[k].psnr,2)}</td><td>${f(m[k].lpips,3)}</td><td>${f((c[ck]||{}).chamfer_mm_clean_conf50,1)}</td></tr>`).join('')+
  `<tr><td>Copy frame 0</td><td>${f(m.copy0.psnr,2)}</td><td>${f(m.copy0.lpips,3)}</td><td>–</td></tr>`;}
function uni(k,v){['L','R'].forEach(s=>sides[s].pts.forEach(p=>p.material.uniforms[k].value=v));}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=(mode==='single'?w:w/2)/h;cam.updateProjectionMatrix();uni('pxS',pxScale());}
new ResizeObserver(resize).observe(stage);
document.querySelectorAll('[data-bit]').forEach(c=>c.onchange=()=>uni('en',enabled()));
$('conf').oninput=e=>{$('confv').textContent=+e.target.value?`rank ${e.target.value}/15 (keeps top ${Math.round((16-e.target.value)/16*100)}%)`:'off';uni('confMin',+e.target.value);};
$('psz').oninput=e=>uni('psz',+e.target.value);
$('frus').onchange=()=>{frustums('L');frustums('R');};
$('reset').onclick=resetView;
$('seek').oninput=e=>setT(+e.target.value);
$('fps').oninput=e=>$('fpsv').textContent=e.target.value+' fps';
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'❚❚':'▶';};
document.querySelectorAll('#src button').forEach(b=>b.onclick=()=>{srcR=b.dataset.s;document.querySelectorAll('#src button').forEach(x=>x.setAttribute('aria-pressed',x===b));show(sceneI,true);});
document.querySelectorAll('#mode button').forEach(b=>{if(!b.dataset.m||b.dataset.m==='sync'){b.style.visibility='hidden';return;}b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(x=>x.setAttribute('aria-pressed',x===b));resize();labels();};});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type==='range')return;
  if(e.key===' '){e.preventDefault();$('play').click();}else if(e.key==='ArrowRight'){playing=false;$('play').textContent='▶';setT((t+1)%13);}
  else if(e.key==='ArrowLeft'){playing=false;$('play').textContent='▶';setT((t+12)%13);}
  else if(e.key==='ArrowDown'){e.preventDefault();show(Math.min(S.scenes.length-1,sceneI+1));}else if(e.key==='ArrowUp'){e.preventDefault();show(Math.max(0,sceneI-1));}});
function tick(ts){requestAnimationFrame(tick);
  if(playing&&sides.R.data&&ts-last>1000/+$('fps').value){last=ts;setT((t+1)%sides.R.data.meta.T);}
  ctl.update();const w=stage.clientWidth,h=stage.clientHeight,pr=renderer.getPixelRatio();
  if(mode==='single'){renderer.setViewport(0,0,w,h);renderer.setScissor(0,0,w,h);renderer.render(scenes.R,cam);}
  else{renderer.setViewport(0,0,w/2,h);renderer.setScissor(0,0,w/2,h);renderer.render(scenes.L,cam);
       renderer.setViewport(w/2,0,w/2,h);renderer.setScissor(w/2,0,w/2,h);renderer.render(scenes.R,cam);}}
// scenes are baked one by one in the background; re-read the list until all are ready
function listScenes(j){const ck=j.ckpt,mm=j.mean,n=j.scenes.length,N=j.n_total||n;
  $('ck').innerHTML=`Tokens step ${ck.tokens.global_step} · Tiled step ${ck.tiled.global_step}<br>mean PSNR <span class="tok">${f(mm.tokens.psnr,2)}</span> / <span class="til">${f(mm.tiled.psnr,2)}</span> · copy-0 ${f(mm.copy0.psnr,2)}`+(n<N?`<br><b style="color:var(--accent)">${n} of ${N} scenes ready · more appear automatically</b>`:'');
  $('list').innerHTML=j.scenes.map((s,k)=>`<button class="scene" onclick="show(${k})">${String(s.i+1).padStart(2,'0')} · ${s.name.replace(/_user_\d+_scene_\d+/,'').replace(/_/g,' ')}<small>PSNR <span class="tok">${f(s.metrics.tokens.psnr,1)}</span> / <span class="til">${f(s.metrics.tiled.psnr,1)}</span> · ${(s.points.pred_tokens/1e3).toFixed(0)}k pts</small></button>`).join('');
  document.querySelectorAll('.scene').forEach((b,k)=>b.setAttribute('aria-current',k===sceneI));
  return n<N;}
async function getScenes(){const r=await fetch('scenes.json',{cache:'no-store'});if(!r.ok)throw new Error('scenes.json not ready yet');return r.json();}
async function firstScenes(){for(;;){try{const j=await getScenes();if(j.scenes.length)return j;}catch(e){}
  $('load').textContent='waiting for the first baked scene…';await new Promise(r=>setTimeout(r,10000));}}
firstScenes().then(j=>{S=j;const more=listScenes(j);
  let i=0;try{i=+(localStorage.getItem('cv_scene')||0)}catch(e){} resize(); show(i<j.scenes.length?i:0); requestAnimationFrame(tick);
  if(more){const iv=setInterval(async()=>{try{const j2=await getScenes();if(j2.scenes.length>S.scenes.length){S=j2;if(!listScenes(j2))clearInterval(iv);}}catch(e){}},30000);}});
</script>
</body></html>
